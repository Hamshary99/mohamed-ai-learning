name: Push & Deploy Workflow

on:
  push:
    branches:
      - main
    paths:
       - "studentgator-rag-service/**"
       - ".github/workflows/deploy.yml"

env:
  SERVICE_DIR: "studentgator-rag-service"
  PYTHON_VERSION: "3.11"
  LANGSMITH_TRACING: "false"
  REGISTRY: "ghcr.io"
  IMAGE_NAME: "studentgator-rag-service"


jobs:
  lint:
    name: Code Quality (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run Ruff Linter
        uses: astral-sh/ruff-action@v4.1.0
        with:
          src: "./studentgator-rag-service/src"
          args: "check --select E,F --ignore E501 --output-format=github"

  build:
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: Checkout Build
        uses: actions/checkout@v4
      - name: Compile Python files
        run: python -m compileall studentgator-rag-service/src


  test:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false   # Keep running other Python versions even if one version fails
      max-parallel: 2    # Run at most 2 matrix jobs at the same time
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: |
          pip install pytest pydantic pydantic-settings langchain-core langchain-community langchain-text-splitters langgraph
          pytest studentgator-rag-service/tests/test_service.py -k "not rag" -v


  # 2B. Also waits for 'build', so it runs in parallel with 'test'
  ingest:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run RAG ingestion tests
        run: |
          pip install pytest pydantic pydantic-settings langchain-core langchain-community langchain-text-splitters langgraph pypdf
          pytest studentgator-rag-service/tests/test_service.py -k "rag" -v

  build-and-push:
    name: Build & Push to GitHub Container Registry
    runs-on: ubuntu-latest
    needs: [test, ingest]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_URI="${{ env.REGISTRY }}/$OWNER/${{ env.IMAGE_NAME }}"
          docker build -t "$IMAGE_URI:${{ github.sha }}" -t "$IMAGE_URI:latest" ./${{ env.SERVICE_DIR }}
          docker push "$IMAGE_URI:${{ github.sha }}"
          docker push "$IMAGE_URI:latest"

  verify-container:
    name: Verify Container (Smoke Test)
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and Test Docker Container
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_URI="${{ env.REGISTRY }}/$OWNER/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker pull "$IMAGE_URI"
          docker run -d --name test-rag-service -p 8080:8080 -e PORT=8080 -e GEMINI_API_KEY=dummy "$IMAGE_URI"
          
          # Wait up to 30s for uvicorn to boot and respond
          timeout 30s bash -c 'until curl -s http://localhost:8080/api/v1/health; do sleep 2; done'
          
          # Assert health status
          HEALTH_STATUS=$(curl -s http://localhost:8080/api/v1/health)
          echo "Health check response: $HEALTH_STATUS"
          echo "$HEALTH_STATUS" | grep '"status":"healthy"'
