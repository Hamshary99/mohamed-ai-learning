name: Actions & Docker Workflow

on:
  workflow_dispatch:

jobs:
  # Hybrid job: runs on Ubuntu VM, but executes one isolated step inside a Docker container
  hybrid_job:
    runs-on: ubuntu-latest
    steps:
      # Official GitHub action (owner/repo@ref)
      - name: Checkout repository code
        uses: actions/checkout@v7.0.1

      # Runs directly on the host Ubuntu VM; 'env:' sets environment variables for this step
      - name: Run a command in Ubuntu VM
        env:
          STAGE_NAME: "Ubuntu-VM"
        run: echo "Running on $STAGE_NAME"

      # Step-level container: spins up Alpine only for this single step
      - name: Run inside an Alpine container
        uses: docker://alpine:3.14 # image must be publicly accessed here
        with: # placeholder inputs till we move on to the project
          entrypoint: /bin/sh
          args: -c "echo 'this runs inside alpine container'"

      # Back on the host Ubuntu VM
      - name: Run another command in ubuntu vm
        run: echo "Back to VM"

  # Job-level container: every step in this job runs inside the specified container
  dockerized_job:
    runs-on: ubuntu-latest
    container:
      image: node:20-alpine # using public image for now; swap with private image below once built
      # image: ghcr.io/my-org/my-private-image:latest # haven't made docker image yet
      # credentials:
      #   username: ${{ secrets.DOCKER_USERNAME }}
      #   password: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - run: node --version
      - run: echo "This whole job runs in a node.js container"
